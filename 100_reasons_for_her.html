<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Little Reasons ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.22), transparent 28%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,.18), transparent 30%),
      linear-gradient(135deg, #ff758c, #ff7eb3, #c471ed);
    color: #5b1734;
    overflow: hidden;
  }

  .hearts span {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    opacity: .55;
    animation: float 9s linear infinite;
    pointer-events: none;
  }
  .hearts span:nth-child(1){left:8%;animation-delay:0s}
  .hearts span:nth-child(2){left:23%;animation-delay:2s}
  .hearts span:nth-child(3){left:41%;animation-delay:5s}
  .hearts span:nth-child(4){left:63%;animation-delay:1s}
  .hearts span:nth-child(5){left:82%;animation-delay:4s}

  @keyframes float {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    15% { opacity: .55; }
    100% { transform: translateY(-115vh) rotate(35deg); opacity: 0; }
  }

  .card {
    width: min(92vw, 650px);
    padding: 42px 30px 34px;
    text-align: center;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 28px;
    box-shadow: 0 25px 70px rgba(91, 23, 52, .25);
    position: relative;
    z-index: 2;
  }

  .tiny { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; opacity: .65; }
  h1 { margin: 10px 0 8px; font-size: clamp(34px, 7vw, 58px); }
  .subtitle { margin: 0 auto 28px; font-size: 17px; opacity: .72; max-width: 470px; line-height: 1.5; }

  #compliment {
    min-height: 135px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-size: clamp(24px, 5vw, 38px);
    line-height: 1.25;
    font-weight: bold;
    transition: opacity .18s ease, transform .18s ease;
  }

  .show {
    animation: pop .35s ease;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  button {
    border: 0;
    padding: 16px 30px;
    border-radius: 999px;
    background: #e83e6f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(232,62,111,.3);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 30px rgba(232,62,111,.38); }
  button:active { transform: scale(.97); }

  .counter { margin-top: 16px; font-size: 13px; opacity: .55; }
  .footer { margin-top: 20px; font-size: 13px; opacity: .55; }
</style>
</head>
<body>
<div class="hearts"><span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span></div>

<main class="card">
  <div class="tiny">A little something for you</div>
  <h1>100 reasons you're amazing ❤️</h1>
  <p class="subtitle">Tap the button. I have a hundred things I could say about you… and honestly, I could keep going.</p>

  <div id="compliment">Tap the button, beautiful ✨</div>

  <button id="next">Give me a compliment 💕</button>
  <div class="counter" id="counter">0 / 100 discovered</div>
  <div class="footer">Made with a suspicious amount of love.</div>
</main>

<script>

"You have the sweetest way of caring about people.",
"You're my favorite notification.",

"I love your little expressions.",
"You make even boring conversations fun.",
"You're incredibly special to me.",
"Your kindness makes you even more attractive.",
"You're the person I want beside me for the little things.",
"You make my world feel less ordinary.",
"You're ridiculously good at being you.",
"I love how your mind works.",
"You're beautiful in a way that pictures never quite capture.",
"Your laugh should honestly be illegal because it distracts me.",
"You have a warmth that people naturally gravitate toward.",
"You're one of my favorite reasons to smile.",
"You make my heart feel ridiculously lucky.",
"You're cute when you're annoyed, although I may never admit that to you.",

"You're the reason I sometimes catch myself smiling for no reason.",
"Your happiness matters to me more than you know.",
"You're beautiful in all the tiny details.",
"I love the way you make me feel understood.",
"You're genuinely one of a kind.",
"You have the cutest way of reacting when you're surprised.",
"You're a walking reminder that life can be beautiful.",
"I could probably write another hundred compliments about you.",
"You're somehow my peace and my favorite chaos.",
"You're incredibly easy to love.",
"You make my world more colorful.",
"You're the kind of beautiful that stays in my head.",
"I love being able to call you mine.",
"You're stunning, but it's your personality that keeps me falling.",
"You're my favorite face to see.",
"Even on your worst hair day, you're still gorgeous to me.",
"You make my heart feel ridiculously full.",
"If I had to choose my favorite person again, I'd still choose you.",
"And finally: you're you — and that's more than enough for me. ❤️"
];

let remaining = [...compliments];
let shown = 0;

const box = document.getElementById("compliment");
const counter = document.getElementById("counter");
const button = document.getElementById("next");

button.addEventListener("click", () => {
  if (remaining.length === 0) {
    remaining = [...compliments];
    shown = 0;
    box.textContent = "You finished all 100… so here's a bonus: I still have a million more things I love about you. ❤️";
    counter.textContent = "100 / 100 discovered — tap again for a new round";
    box.classList.remove("show");
    void box.offsetWidth;
    box.classList.add("show");
    return;
  }

  const index = Math.floor(Math.random() * remaining.length);
  const compliment = remaining.splice(index, 1)[0];
  shown++;

  box.classList.remove("show");
  void box.offsetWidth;
  box.textContent = compliment;
  box.classList.add("show");

  counter.textContent = `${shown} / 100 discovered`;
  button.textContent = shown === 100 ? "Start another round 💗" : "Another one 💕";
});
</script>
</body>
</html>
