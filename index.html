<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7c5cff">
<title>Isha (The Perfectionist) — 100 Compliments</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  font-family: Georgia, "Times New Roman", serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.35), transparent 28%),
    radial-gradient(circle at 85% 85%, rgba(255,255,255,.22), transparent 30%),
    linear-gradient(135deg, #6a5acd, #8b72e8, #b18cff);
  color: #282044;
  overflow: hidden;
}
.floaters span {
  position: fixed;
  bottom: -30px;
  font-size: 22px;
  opacity: .35;
  animation: float 9s linear infinite;
  pointer-events: none;
}
.floaters span:nth-child(1) { left: 8%; animation-delay: 0s; }
.floaters span:nth-child(2) { left: 28%; animation-delay: 2s; }
.floaters span:nth-child(3) { left: 50%; animation-delay: 4s; }
.floaters span:nth-child(4) { left: 72%; animation-delay: 1s; }
.floaters span:nth-child(5) { left: 90%; animation-delay: 5s; }
@keyframes float {
  0% { transform: translateY(0) rotate(0); opacity: 0; }
  15% { opacity: .35; }
  100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; }
}
.card {
  width: min(92vw, 680px);
  padding: 42px 30px 32px;
  text-align: center;
  background: rgba(255,255,255,.90);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 30px;
  box-shadow: 0 25px 70px rgba(38,25,90,.28);
  position: relative;
  z-index: 2;
}
.tag {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: .58;
}
h1 {
  margin: 12px 0 8px;
  font-size: clamp(34px, 7vw, 58px);
  line-height: 1.05;
}
.subtitle {
  margin: 0 auto 24px;
  font-size: clamp(17px, 3vw, 21px);
  line-height: 1.5;
  opacity: .75;
}
#compliment {
  min-height: 155px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-size: clamp(23px, 4.8vw, 36px);
  line-height: 1.3;
  font-weight: bold;
}
.show { animation: pop .32s ease; }
@keyframes pop {
  0% { opacity: 0; transform: translateY(9px) scale(.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
button {
  border: 0;
  padding: 16px 30px;
  border-radius: 999px;
  background: #6752d6;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(103,82,214,.3);
  transition: transform .15s ease, box-shadow .15s ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(103,82,214,.4); }
button:active { transform: scale(.97); }
.counter {
  margin-top: 15px;
  font-size: 13px;
  opacity: .52;
}
.footer {
  margin-top: 18px;
  font-size: 13px;
  opacity: .5;
}
</style>
</head>
<body>
<div class="floaters"><span>✦</span><span>✧</span><span>✦</span><span>✧</span><span>✦</span></div>

  <div class="tag">A little something for a great friend</div>

  <div id="compliment">Tap the button and discover your first compliment.</div>

  <button id="next">Give me a compliment ✨</button>
  <div class="counter" id="counter">0 / 100 discovered</div>
  <div class="footer">100 compliments. Zero romance. Just facts. 😄</div>
</main>

let remaining = [...compliments];
let shown = 0;

const box = document.getElementById("compliment");
const counter = document.getElementById("counter");
const button = document.getElementById("next");

button.addEventListener("click", () => {
  if (remaining.length === 0) {
    remaining = [...compliments];
    shown = 0;
    box.textContent = "You finished all 100. The perfectionist has officially completed the assignment. 😄";
    counter.textContent = "100 / 100 discovered — tap again for another round";
  } else {
    const index = Math.floor(Math.random() * remaining.length);
    box.textContent = remaining.splice(index, 1)[0];
    shown++;
    counter.textContent = `${shown} / 100 discovered`;
  }

  box.classList.remove("show");
  void box.offsetWidth;
  box.classList.add("show");
  button.textContent = shown >= 100 ? "Start again ✨" : "Another one ✨";
